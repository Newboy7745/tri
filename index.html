<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tri">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Tri by Khalid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#061634">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen phone app. Navy brand band on top, scrolling work area, bottom tab bar.
   Every object photo sits on a light neutral "stage" in both themes; progress is coded grey → blue → orange → green. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#0B1633; --ink-2:#45526E; --muted:#717E97; --line:#D6DCE7;
  --navy:#061634; --navy-2:#0E2552; --on-navy:#F3F6FC; --on-navy-2:#A4B4D3;
  --gold:#F2A516; --gold-2:#FFC24D; --on-gold:#281800;
  --primary:#10285A; --on-primary:#FFFFFF;
  --stage:#F1F2F4; --stage-line:#E1E4E9;
  --st0:#8C96A8; --st1:#2F6FE4; --st2:#D9661A; --st3:#14935F; --alert:#C93434;
  --st0-bg:#EBEEF3; --st1-bg:#E4ECFD; --st2-bg:#FCEDE2; --st3-bg:#E1F3EA; --alert-bg:#FBE8E8;
  --focus:#2F6FE4; --scrim:rgba(3,10,24,.55);
  --shadow:0 1px 2px rgba(11,22,51,.06),0 4px 14px rgba(11,22,51,.06);
  --crop-bg:#080C14; --crop-ink:#EEF2F8; --crop-ink-2:#9AA6BC;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060C19; --surface:#0E182C; --surface-2:#132039; --ink:#E8EDF7; --ink-2:#B0BBD1; --muted:#8693AD; --line:#23324F;
  --navy:#030A18; --navy-2:#0B1C3E; --on-navy:#F3F6FC; --on-navy-2:#9FB0D0;
  --gold:#F5B02E; --gold-2:#FFC855; --on-gold:#221500;
  --primary:#DCE5F7; --on-primary:#0B1633;
  --stage:#E6E8EB; --stage-line:#C9CED6;
  --st0:#7A8496; --st1:#3A78F2; --st2:#CF6820; --st3:#239E66; --alert:#E05656;
  --st0-bg:#1A2337; --st1-bg:#132953; --st2-bg:#3A2312; --st3-bg:#0E3223; --alert-bg:#3A1717;
  --focus:#6E9BFF; --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060C19; --surface:#0E182C; --surface-2:#132039; --ink:#E8EDF7; --ink-2:#B0BBD1; --muted:#8693AD; --line:#23324F;
  --navy:#030A18; --navy-2:#0B1C3E; --on-navy:#F3F6FC; --on-navy-2:#9FB0D0;
  --gold:#F5B02E; --gold-2:#FFC855; --on-gold:#221500;
  --primary:#DCE5F7; --on-primary:#0B1633;
  --stage:#E6E8EB; --stage-line:#C9CED6;
  --st0:#7A8496; --st1:#3A78F2; --st2:#CF6820; --st3:#239E66; --alert:#E05656;
  --st0-bg:#1A2337; --st1-bg:#132953; --st2-bg:#3A2312; --st3-bg:#0E3223; --alert-bg:#3A1717;
  --focus:#6E9BFF; --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.s0{--stc:var(--st0);--stb:var(--st0-bg)} .s1{--stc:var(--st1);--stb:var(--st1-bg)}
.s2{--stc:var(--st2);--stb:var(--st2-bg)} .s3{--stc:var(--st3);--stb:var(--st3-bg)}

#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;background:var(--bg);position:relative}
.top{display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--on-navy);padding-block:9px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top .logo{width:38px;height:38px;border-radius:10px;flex:none}
.brand{display:flex;align-items:baseline;gap:6px;min-width:0}
.brand b{font:italic 850 21px/1 var(--f-display);font-stretch:110%;letter-spacing:-.01em;color:var(--on-navy)}
.brand span{font:italic 600 13px/1 var(--f-display);color:var(--gold)}
.ai-badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:700;color:var(--on-navy-2);white-space:nowrap}
.ai-badge i{width:7px;height:7px;border-radius:50%;background:var(--on-navy-2)}
.ai-badge.on i{background:var(--gold)} .ai-badge.on{color:var(--on-navy)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--on-gold);font:600 11px/18px var(--f-mono)}

.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:15px;line-height:1.1;text-align:center;background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{background:var(--alert-bg);color:var(--alert)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.xl{min-height:56px;font-size:16.5px;border-radius:14px}
.btn.block{width:100%}
.linkbtn{border:0;background:none;padding:6px 2px;font-weight:700;font-size:14px;color:var(--st1)}

.h1{margin:0;font:italic 850 27px/1.08 var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.sec-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sec-title{margin:0;font:800 13px/1.2 var(--f-display);font-stretch:115%;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.sec-title .n{font-family:var(--f-mono);color:var(--ink);margin-left:6px}
.num{font:600 11.5px/1 var(--f-mono);color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.panel{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Capture */
.capture{display:grid;gap:14px}
.cap-btns{display:grid;grid-template-columns:1fr auto;gap:10px}
.session{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.session .field>span{font-size:12px}
.ai-line{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.ai-line b{color:var(--ink)}

/* Photos queue */
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ph{flex:none;width:140px;display:grid;gap:6px;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.ph-img{position:relative;height:96px;border-radius:10px;overflow:hidden;background:var(--stage)}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.ph-img .scan{position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(242,165,22,.55),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:-30%}100%{top:100%}}
@media (prefers-reduced-motion:reduce){.ph-img .scan{animation:none;top:35%}}
.ph-st{font-size:12.5px;font-weight:700;line-height:1.25}
.ph-st.err{color:var(--alert)}
.ph-acts{display:flex;gap:6px}
.ph-acts .btn{flex:1;min-height:36px;padding:0;border-radius:9px}

/* Cards */
.list{display:grid;gap:10px}
.card{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border-radius:14px;padding:10px 12px 10px 14px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--stc)}
.card.picked{outline:2.5px solid var(--gold);outline-offset:-1px}
.thumb{position:relative;width:86px;height:86px;padding:5px;border:1px solid var(--stage-line);border-radius:11px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.thumb .tick{position:absolute;top:5px;left:5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(6,22,52,.35);display:grid;place-items:center}
.card.picked .thumb .tick{background:var(--gold);border-color:var(--gold)}
.card.picked .thumb .tick svg{stroke:var(--on-gold)}
.thumb .tick svg{width:14px;height:14px;fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.info{min-width:0;display:grid;gap:5px;cursor:pointer}
.row1{display:flex;gap:8px;align-items:center;min-width:0}
.crumb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{margin:0;font-size:15.5px;font-weight:700;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.name.empty{color:var(--muted);font-style:italic;font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-family:var(--f-body);display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 9px 0 6px;border-radius:999px;background:var(--stb);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.g{width:15px;height:15px;flex:none}
.g .f{fill:var(--stc)} .g .r{fill:none;stroke:var(--stc);stroke-width:1.7}
.tag{display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.q{font-family:var(--f-mono);font-weight:600;color:var(--ink);background:var(--surface-2);border-color:transparent}
.tag.late{color:var(--alert);background:var(--alert-bg);border-color:transparent;font-weight:700}
.tag.half{color:var(--st2);border-color:currentColor;font-weight:700}
.quick{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.quick .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.oc{min-width:36px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.oc[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.quick .btn{margin-left:auto}

/* Empty state */
.empty-state{display:grid;gap:14px}
.steps3{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps3 li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps3 li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:italic 850 17px var(--f-display)}
.steps3 b{display:block}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13.5px}

/* Inventory */
.inv-top{position:sticky;top:-16px;z-index:5;margin-top:-16px;padding-top:12px;padding-bottom:10px;background:var(--bg);display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.search .ico{color:var(--muted)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.scroller::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.tab .c{font:600 11.5px var(--f-mono);color:var(--muted)}
.tab.empty{opacity:.55}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .c{color:var(--gold-2)}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.fchip.stg[aria-pressed="true"]{background:var(--stb)}
.list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.list-head .count{font-size:13.5px;color:var(--ink-2)}
.list-head select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 8px;font-size:13.5px}

/* Suivi */
.hero{display:grid;gap:14px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font:italic 850 56px/0.9 var(--f-display);font-stretch:108%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:24px;margin-left:2px}
.bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%;background:var(--stc);min-width:0}
.bar.thin{height:9px;border-radius:5px}
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lg button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700;text-align:left}
.lg button .v{margin-left:auto;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.rows{display:grid;gap:4px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.r:last-child{border-bottom:0}
.r .t{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .v{font:600 12.5px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.r .bar{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px}
.kpi b{display:block;font:italic 800 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.don-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Fields & sheets */
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:10px 12px;font-size:16px}
textarea.inp{resize:vertical;min-height:72px;line-height:1.4}
.combo-new{display:grid;grid-template-columns:1fr auto;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.stp{display:inline-flex;align-items:center;gap:7px;padding-left:9px}
.chip.stp[aria-pressed="true"]{background:var(--stb);border:2px solid var(--stc);color:var(--ink)}
.chip.add{border-style:dashed}
.chip-inp{flex-basis:100%}
.stepper{display:grid;grid-template-columns:46px 1fr 46px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--surface-2);font-size:22px;font-weight:700}
.stepper input{border:0;text-align:center;font:600 18px var(--f-mono);min-width:0;background:var(--surface);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{min-height:46px;border:0;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--primary)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{width:100%;max-width:780px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
.sheet-head{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .ttl{flex:1;min-width:0;display:grid;gap:2px}
.sheet-head .ttl b{font:800 16px/1.15 var(--f-display);font-stretch:108%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn.danger{color:var(--alert)}
.sheet-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-foot{display:flex;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}

        } catch (e) { console.warn(e); p.status = 'error'; p.error = aiErrorText(e); if (DENIED.includes(e && e.code)) { aiState = 'denied'; renderBadge(); } }
        await savePhoto(p); await saveSeq(); await saveLists(); if (S.ui.view === 'home') render(); else updateNavBadge();
        processBg(); continue;
      }
      if (!aiOn()) break;
      const it = S.items.find(i => i.idState === 'pending');

        try { await identifyItem(it); it.idState = 'done'; } catch (e) { console.warn(e); it.idState = 'error'; toast(aiErrorText(e)); if (DENIED.includes(e && e.code)) { aiState = 'denied'; renderBadge(); } }
        await saveItem(it); await saveLists(); refreshCard(it); if (editId === it.id && !editDirty) openEditor(it.id);
        if (S.ui.view === 'home') render();

      if (batch.length) {
        batch.forEach(i => { i.priceState = 'running'; });
        try { await estimatePrices(batch); } catch (e) { console.warn(e); }
        for (const i of batch) { i.priceState = 'done'; await saveItem(i); refreshCard(i); }

}

function provHTML() {

function stackBar(c, thin) {
  const tot = c.reduce((a, b) => a + b, 0) || 1;
  return `<div class="bar${thin ? ' thin' : ''}" role="img" aria-label="${c.map((v, i) => `${STAGES[i]} ${v}`).join(', ')}">${c.map((v, i) => v ? `<span class="s${i}" style="width:${(v / tot * 100).toFixed(2)}%" title="${STAGES[i]} : ${v}"></span>` : '').join('')}</div>`;
}
function trackHTML() {
  const all = S.items.filter(i => i.status === 'ok');
  const inbox = S.items.filter(i => i.status === 'inbox').length;
  if (!all.length) return `<div class="view"><div><h1 class="h1">Suivi du tri</h1><p class="lede">Le suivi démarre dès que tu valides tes premiers éléments.${inbox ? ` ${inbox} élément(s) attendent sur l’Accueil.` : ''}</p></div>
    <section class="panel empty-state"><h2 class="sec-title">Code couleur</h2><div class="legend">${STAGES.map((s, i) => `<div>${pill(i, s)}</div>`).join('')}</div>
    <p class="muted small" style="margin:0">Chaque fiche avance de gauche à droite : à trier, décision prise, action en cours, terminé. Une fiche bloquée plus de 14 jours passe en alerte rouge.</p></section></div>`;
  const c = [0, 0, 0, 0]; all.forEach(i => c[stageOf(i)]++);
  const pct = Math.round(c[3] / all.length * 100);
  const units = all.reduce((s, i) => s + (i.qty || 1), 0);
  const group = keyFn => { const m = new Map(); all.forEach(i => { const k = keyFn(i); if (!m.has(k)) m.set(k, [0, 0, 0, 0]); m.get(k)[stageOf(i)]++; }); return m; };
  const byAction = group(i => i.action || 'À décider'), byOwner = group(i => i.owner || '—'), byCat = group(i => i.category);
  const dons = all.filter(i => kindOf(i.action) === 'don');
  const donBy = new Map(); dons.forEach(i => { const k = i.recipient || '—'; if (!donBy.has(k)) donBy.set(k, {done: 0, todo: 0}); donBy.get(k)[stageOf(i) === 3 ? 'done' : 'todo']++; });
  const ventes = all.filter(i => kindOf(i.action) === 'vente');
  const enVente = ventes.filter(i => stageOf(i) < 3);
  const estim = enVente.reduce((s, i) => s + (num(i.priceEst) || priceMid(i)) * (i.qty || 1), 0);
  const encaisse = ventes.filter(i => stageOf(i) === 3 || norm(i.step).startsWith('vendu')).reduce((s, i) => s + num(i.priceSold), 0);
  const valLo = all.reduce((s, i) => s + num(i.priceLow) * (i.qty || 1), 0), valHi = all.reduce((s, i) => s + num(i.priceHigh) * (i.qty || 1), 0);
  const late = all.filter(isLate).length, orphans = all.filter(isOrphan), noOwner = all.filter(i => !i.owner).length;
  const pairs = all.reduce((s, i) => s + pairsOf(i), 0);
  const rowsOf = (m, kind) => [...m.entries()].sort((a, b) => collator.compare(a[0], b[0])).map(([k, v]) => {
    const tot = v.reduce((x, y) => x + y); const lbl = k === '—' ? (kind === 'owner' ? 'Sans propriétaire' : 'Non renseigné') : k;
    return `<button type="button" class="r" data-act="goto" data-k="${kind}" data-v="${esc(k)}"><span class="t">${esc(lbl)}</span><span class="v">${v[3]}/${tot} terminé${v[3] > 1 ? 's' : ''}</span>${stackBar(v, true)}</button>`;
  }).join('');
  const todo = [...byAction.entries()].filter(([a, v]) => a !== 'À décider' && (v[1] + v[2]) > 0).sort((a, b) => collator.compare(a[0], b[0]));
  return `<div class="view">
    <div><h1 class="h1">Suivi du tri</h1><p class="lede">${all.length} fiches validées, ${units} objets${pairs ? `, dont ${String(pairs).replace('.', ',')} paires` : ''}.${inbox ? ` ${inbox} élément(s) encore sur l’Accueil.` : ''}</p></div>
    <section class="panel hero">
      <div class="hero-top"><div><div class="big">${pct}<small>%</small></div><div class="muted small">des fiches sont terminées</div></div>
        <div class="muted small" style="text-align:right">${c[3]} / ${all.length}${valHi ? `<br>Valeur de revente estimée<br><b style="color:var(--ink)">${euro(valLo)} – ${euro(valHi)}</b>` : ''}</div></div>
      ${stackBar(c)}
      <div class="lg">${STAGES.map((s, i) => `<button type="button" class="s${i}" data-act="goto" data-k="stage" data-v="${i}">${glyph(i)}${s}<span class="v">${c[i]}</span></button>`).join('')}</div>
    </section>
    ${(late || orphans.length || noOwner || c[0]) ? `<section class="panel view" style="gap:6px"><h2 class="sec-title">Points d’attention</h2><div class="rows">
      ${c[0] ? `<button type="button" class="r" data-act="goto" data-k="stage" data-v="0"><span class="t">Encore à décider</span><span class="v">${c[0]}</span></button>` : ''}
      ${late ? `<button type="button" class="r" data-act="goto" data-k="late"><span class="t" style="color:var(--alert)">En attente depuis plus de 14 jours</span><span class="v">${late}</span></button>` : ''}
      ${orphans.length ? `<button type="button" class="r" data-act="goto" data-k="orphans"><span class="t">Paires incomplètes (1/2)</span><span class="v">${orphans.reduce((s, i) => s + (i.qty || 1), 0)}</span></button>` : ''}
      ${noOwner ? `<button type="button" class="r" data-act="goto" data-k="owner" data-v="—"><span class="t">Sans propriétaire</span><span class="v">${noOwner}</span></button>` : ''}
    </div></section>` : ''}
    ${todo.length ? `<section class="panel view" style="gap:6px"><h2 class="sec-title">Actions en cours</h2><div class="rows">${todo.map(([a, v]) => `<button type="button" class="r" data-act="goto" data-k="action" data-v="${esc(a)}"><span class="t">${esc(a)}</span><span class="v">${v[1]} à faire · ${v[2]} en cours · ${v[3]} fait${v[3] > 1 ? 's' : ''}</span>${stackBar(v, true)}</button>`).join('')}</div></section>` : ''}
    ${dons.length ? `<section class="panel view" style="gap:6px"><h2 class="sec-title">Dons par destinataire</h2><div class="rows">${[...donBy.entries()].sort((a, b) => collator.compare(a[0], b[0])).map(([k, v]) => `<button type="button" class="r" data-act="goto" data-k="recipient" data-v="${esc(k)}"><span class="t">${k === '—' ? 'Destinataire à choisir' : esc(k)}</span><span class="v don-r">${pill(3, v.done + ' donné' + (v.done > 1 ? 's' : ''))}${pill(1, v.todo + ' pas encore')}</span></button>`).join('')}</div></section>` : ''}
    ${ventes.length ? `<section class="panel view" style="gap:10px"><h2 class="sec-title">Ventes</h2><div class="kpis">
      <div class="kpi"><b>${enVente.length}</b><span>en cours</span></div><div class="kpi"><b>${euro(estim)}</b><span>valeur estimée</span></div><div class="kpi"><b>${euro(encaisse)}</b><span>encaissé</span></div></div></section>` : ''}
    <section class="panel view" style="gap:6px"><h2 class="sec-title">Par personne</h2><div class="rows">${rowsOf(byOwner, 'owner')}</div></section>
    <section class="panel view" style="gap:6px"><h2 class="sec-title">Par catégorie</h2><div class="rows">${rowsOf(byCat, 'cat')}</div></section>
    <button type="button" class="btn ghost block" data-act="exportOpen" data-preset="all">${I.share}Exporter ou partager une liste (PDF / JPG)</button>
  </div>`;
}

let editId = null, editDirty = false;

function closeSheet(fromPop) { const s = $('#sheet'); if (s.hidden) return; s.hidden = true; s.innerHTML = ''; editId = null; editDirty = false; if (!fromPop && !IN_ARTIFACT && history.state && history.state.sheet) { try { history.back(); } catch (e) {} } }
window.addEventListener('popstate', () => { if (!$('#cropper').hidden) closeCropper(); else closeSheet(true); });
function stepsChips(id, action, value) { return chipsHTML(id, stepsOf(action).map(s => s.l), value, {stage: l => (stepsOf(action).find(s => s.l === l) || {s: 1}).s}); }
function manageBlock(a, it) {

    <button type="button" class="btn ghost" data-act="adText">${I.copy}Texte d’annonce</button>`;
  return h;
}

/* ---------- photos ---------- */
async function addFiles(files) {
  files = [...files].filter(f => f && /^image\//.test(f.type || 'image/'));
  if (!files.length) return;
  toast(files.length > 1 ? `${files.length} photos ajoutées` : 'Photo ajoutée');
  let last = null;
  for (const f of files) {
    try {
      const {blob, w, h} = await scaleTo(f, 2200, 0.9);
      const blobKey = await putBlob(blob);
      const p = {id: uid(), createdAt: now(), blobKey, w, h, status: aiOn() ? 'pending' : 'manual', count: 0, error: ''};
      S.photos.push(p); await savePhoto(p); last = p;
    } catch (e) { console.warn(e); toast('Impossible de lire cette image.'); }
  }
  if (S.ui.view !== 'home') setView('home'); else render();
  kick();
  if (!aiOn() && last) openCropper(last, 'manual');
}
async function deletePhoto(id) {
  const i = S.photos.findIndex(p => p.id === id); if (i < 0) return;
  const p = S.photos[i]; S.photos.splice(i, 1);

async function replacePhoto(it, file) {
  try {
    const {blob} = await scaleTo(file, 1100, 0.9);

async function importFile(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'tri-by-khalid') { toast('Ce fichier n’est pas une sauvegarde Tri by Khalid.'); return; }
    if (!await confirmDlg('Importer la sauvegarde ?', `${(d.items || []).length} fiches seront ajoutées ou remplacées (même identifiant). Les autres fiches restent en place.`, 'Importer')) return;
    toast('Import en cours…', 0);
    for (const [k, v] of Object.entries(d.blobs || {})) await safe(dbPut('blobs', dataURLtoBlob(v), k));
    for (const it of d.items || []) { await saveItem(it); const i = S.items.findIndex(x => x.id === it.id); if (i >= 0) S.items[i] = it; else S.items.push(it); }
    for (const p of d.photos || []) { await savePhoto(p); const i = S.photos.findIndex(x => x.id === p.id); if (i >= 0) S.photos[i] = p; else S.photos.push(p); }
    if (d.lists) { for (const [k, v] of Object.entries(d.lists)) { if (k === 'subcats') for (const [c, arr] of Object.entries(v)) arr.forEach(x => learn('subcats', x, c)); else if (k === 'steps') Object.assign(S.lists.steps, v); else if (Array.isArray(v)) v.forEach(x => learn(k, x)); } await saveLists(); }
    S.seq = Math.max(S.seq, d.seq || 0, ...S.items.map(i => i.n || 0)); await saveSeq();
    render(); toast('Sauvegarde importée');
  } catch (e) { console.warn(e); toast('Lecture du fichier impossible.'); }
}

    const L = await dbGet('meta', 'lists'); if (L) { S.lists = Object.assign(clone(DEFAULT_LISTS), L); for (const k of Object.keys(DEFAULT_LISTS)) if (!S.lists[k]) S.lists[k] = clone(DEFAULT_LISTS[k]); }
    sortAllLists(S.lists);
    Object.assign(S.settings, (await dbGet('meta', 'settings')) || {});
    S.seq = Math.max((await dbGet('meta', 'seq')) || 0, ...S.items.map(i => i.n || 0), 0);
  } catch (e) { console.warn(e); }
  for (const p of S.photos) if (p.status === 'analyzing') { p.status = 'pending'; savePhoto(p); }
  for (const it of S.items) {
    if (it.cutState === 'running') it.cutState = 'pending';
    if (it.idState === 'running') it.idState = 'pending';
    if (it.priceState === 'running') it.priceState = 'pending';
    if (it.priceLow === undefined) { it.priceLow = ''; it.priceHigh = ''; it.priceSrc = ''; if (it.etat) applyBareme(it); saveItem(it); }
  }
  try { const v = localStorage.getItem('tri.view'); if (['home', 'inv', 'prov', 'track', 'settings'].includes(v)) S.ui.view = v; } catch (e) {}
  render(); renderBadge();
  setupAI();
  if (!IN_ARTIFACT && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
window.__tri = {S, render, addFiles, buildPDF, renderPages};
init();
})();
</script>
